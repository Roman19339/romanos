# GitHub Actions: construye la ISO de RomanOS en la nube, sin instalar nada en tu PC.
# Va en el repositorio como:  .github/workflows/construir-iso.yml
# Luego: pestaña "Actions" → "Construir ISO RomanOS" → "Run workflow".
name: Construir ISO RomanOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/**', 'overlay/**', '.github/workflows/**']

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Descargar el kit
        uses: actions/checkout@v5

      - name: Liberar espacio en el servidor
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h / /mnt

      - name: Instalar herramientas de construcción
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools

      - name: Construir la ISO (20-40 min)
        run: |
          sudo mkdir -p /mnt/romanos && sudo chown "$USER" /mnt/romanos
          sudo WORK=/mnt/romanos/work OUT=/mnt/romanos/out bash ./build/build-iso.sh
          ls -lh /mnt/romanos/out

      - name: Publicar la ISO para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RomanOS-ISO
          path: /mnt/romanos/out/
          compression-level: 0
          retention-days: 7

      - name: Probar arranque en máquina virtual (QEMU)
        timeout-minutes: 25
        continue-on-error: true
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils
          ISO=$(ls /mnt/romanos/out/*.iso)
          cd /mnt/romanos
          xorriso -osirrox on -indev "$ISO" -extract /casper/vmlinuz vmlinuz -extract /casper/initrd initrd
          sudo chmod a+r vmlinuz initrd
          KVM=""; [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && KVM="-enable-kvm -cpu host"
          timeout 1200 qemu-system-x86_64 $KVM -m 4096 -smp 2 -cdrom "$ISO" -kernel vmlinuz -initrd initrd \
            -append "boot=casper console=tty0 console=ttyS0,115200 romanos-diag locale=es_CL.UTF-8 ---" \
            -vga std -display none -serial file:serial.log -no-reboot || true
          echo "################ DIAGNÓSTICO ################"
          sed -n '/=====ROMANOS-DIAG-INICIO=====/,/=====ROMANOS-DIAG-FIN=====/p' serial.log || true
          grep -q "RESULTADO: ESCRITORIO_OK" serial.log || { echo "--- últimas líneas de la consola"; tail -n 80 serial.log; exit 1; }
