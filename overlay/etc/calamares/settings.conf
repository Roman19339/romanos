modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
sequence:
  - show: [welcome, locale, keyboard, partition, users, summary]
  - exec: [partition, mount, unpackfs, machineid, fstab, locale, keyboard, localecfg,
           users, displaymanager, networkcfg, hwclock, shellprocess, initramfs, grubcfg, bootloader, umount]
  - show: [finished]
branding: romanos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
hide-back-and-next-during-exec: true
quit-at-end: false
