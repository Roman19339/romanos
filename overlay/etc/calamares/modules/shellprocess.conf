# Quita lo exclusivo de la sesión en vivo del sistema instalado
dontChroot: false
timeout: 300
script:
  - "-rm -f /etc/xdg/autostart/romanos-instalador.desktop"
  - "-rm -f /usr/share/applications/romanos-instalar.desktop /etc/skel/Escritorio/romanos-instalar.desktop"
  - "-apt-get -y purge calamares casper"
  - "-apt-get -y autoremove"
