defaultGroups: [adm, cdrom, sudo, dip, plugdev, lpadmin, audio, video, netdev, caja]
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 6
user:
  shell: /bin/bash
  forbidden_names: [root]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "roman-${cpu}"
